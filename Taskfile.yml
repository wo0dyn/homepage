version: '3'

vars:
  BUNDLE_DIR: vendor/bundle

tasks:
  default:
    desc: "List all available tasks"
    cmds:
      - task --list-all
    silent: true

  install:
    desc: "Install Ruby dependencies using Bundler"
    cmds:
      - bundle config set path '{{.BUNDLE_DIR}}'
      - bundle install

  serve:
    desc: "Start Jekyll server"
    cmds:
      - bundle exec jekyll serve
    deps: [install]

  check-deploy:
    desc: "Check GitHub Pages deployment"
    cmds:
      - gh run watch $(gh run list --workflow=pages-build-deployment --limit 1 --json databaseId --jq '.[0].databaseId')

  clean:
    desc: "Clean Jekyll build artifacts"
    cmds:
      - bundle exec jekyll clean

  cleanup:
    desc: "Clean everything for fresh reinstall"
    cmds:
      - rm -f Gemfile.lock
      - rm -rf .bundle/
      - rm -rf '{{.BUNDLE_DIR}}'
      - echo "✔︎ Cleanup complete!"
      - echo "Run 'task install' to reinstall dependencies."
    deps: [clean]
